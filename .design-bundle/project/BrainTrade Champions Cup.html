<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrainTrade Champions Cup 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/page.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #05062E; font-family: "Urbanist", sans-serif; color: #E6E1D2; scroll-behavior: smooth; }
    #root { width: 100%; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/bt-primitives.jsx"></script>
  <script type="text/babel" src="components/cc-page.jsx"></script>

  <script type="text/babel" data-presets="react">
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "accent": "orange"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAKS);
      const accentMap = {
        orange:  { a: "#FF7532", a100: "#FFA072", a50: "#FFE4D3", aDeep: "#E25C1B", aInk: "#FFFFFF" },
        gold:    { a: "#E0B872", a100: "#F1DA9C", a50: "#FBF1D9", aDeep: "#C9A35A", aInk: "#3A2A0A" },
        emerald: { a: "#3FB689", a100: "#7FD3B0", a50: "#D6F2E5", aDeep: "#2E8A66", aInk: "#0E3A28" },
        navy:    { a: "#9AAEFF", a100: "#BCCAFF", a50: "#E6ECFF", aDeep: "#6E84D8", aInk: "#0E1B4A" },
      };
      const a = accentMap[t.accent] || accentMap.orange;
      const rootStyle = {
        "--bt-accent":      a.a,
        "--bt-accent-100":  a.a100,
        "--bt-accent-50":   a.a50,
        "--bt-accent-deep": a.aDeep,
        "--bt-accent-ink":  a.aInk,
        "--bt-accent-soft": a.a100,
      };
      return (
        <div style={rootStyle}>
          <ChampionsCupPage />
          <TweaksPanel title="Tweaks">
            <TweakSection label="Tournament accent">
              <TweakRadio
                label="Palette"
                value={t.accent}
                onChange={v => setTweak("accent", v)}
                options={["orange","gold","emerald","navy"]}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
